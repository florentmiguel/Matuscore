<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatuScore — Connexion</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#2D6A4F">
<style>
:root{--gd:#2D6A4F;--gm:#40916C;--gl:#B7E4C7;--gbg:#F0F7F0;--gr:#6B7280;--bg:#f8faf8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:#1f2937;font-size:14px;min-height:100vh;display:flex;flex-direction:column}
.header{background:var(--gd);color:#fff;padding:28px 20px;text-align:center}
.header h1{font-size:22px;margin-bottom:4px}
.header .by{font-size:10px;opacity:.75;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.header .sub{font-size:13px;opacity:.9}
.wrap{max-width:400px;margin:40px auto 0;padding:0 20px;flex:1}
.card{background:#fff;border-radius:12px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h3{font-size:15px;color:var(--gd);margin-bottom:16px}
label{display:block;font-size:12px;color:var(--gr);margin-bottom:4px;margin-top:14px;font-weight:600}
label:first-of-type{margin-top:0}
input{width:100%;padding:11px 12px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px}
input:focus{outline:none;border-color:var(--gm)}
.btn{display:block;width:100%;padding:13px;border-radius:8px;border:none;font-size:14.5px;font-weight:700;cursor:pointer;margin-top:20px;background:var(--gd);color:#fff}
.btn:disabled{opacity:.6;cursor:not-allowed}
.msg{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:13px;display:none}
.msg.err{background:#FFEBEE;color:#C1121F;display:block}
.foot{text-align:center;margin-top:18px;font-size:13px;color:var(--gr)}
.foot a{color:var(--gd);font-weight:600;text-decoration:none}
</style>
</head>
<body>

<div class="header">
  <h1>🍇 MatuScore</h1>
  <div class="by">by VITI Sens</div>
  <div class="sub">Connexion à votre espace</div>
</div>

<div class="wrap">
  <div class="card">
    <h3>Se connecter</h3>
    <form id="formConnexion">
      <label>Email</label>
      <input type="email" id="email" name="username" autocomplete="username" placeholder="vous@exemple.fr" required>

      <label>Mot de passe</label>
      <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Votre mot de passe" required>

      <button type="submit" class="btn" id="btnSubmit">Se connecter</button>
      <div style="text-align:center;margin-top:10px"><a href="/mot-de-passe-oublie" style="color:var(--gr);font-size:12px;text-decoration:none">Mot de passe oublié ?</a></div>
      <div id="msg" class="msg"></div>
    </form>
  </div>
  <div class="foot">Pas encore de compte ? <a href="/inscription">Créer mon compte</a></div>
</div>

<script>
document.getElementById('formConnexion').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn = document.getElementById('btnSubmit');
  const msg = document.getElementById('msg');
  msg.className = 'msg'; msg.textContent = '';
  btn.disabled = true; btn.textContent = 'Connexion...';

  const body = {
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value,
  };

  try{
    const r = await fetch('/api/connexion', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if(!r.ok){
      msg.className = 'msg err'; msg.textContent = d.error || 'Connexion impossible.';
      btn.disabled = false; btn.textContent = 'Se connecter';
      return;
    }
    window.location.href = d.redirect || '/mon-espace';
  }catch(err){
    msg.className = 'msg err'; msg.textContent = 'Erreur de connexion au serveur.';
    btn.disabled = false; btn.textContent = 'Se connecter';
  }
});
</script>

</body>
</html>
