<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VITI Sens — Dashboard</title>
<style>
:root{--gd:#2D6A4F;--gm:#40916C;--gl:#B7E4C7;--gbg:#F0F7F0;--or:#E76F51;--obg:#FFF3E0;--rd:#C1121F;--rbg:#FFE0E0;--bl:#2196F3;--bbg:#E3F2FD;--gr:#6B7280;--bk:#1a1a1a;--wh:#FAFCF8;--r:10px;--sh:0 2px 12px rgba(45,106,79,0.08)}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(160deg,#f7faf5,#eef5e8 40%,#f5f0e8);color:var(--bk);min-height:100vh}
.hdr{background:var(--gd);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.hdr h1{color:#fff;font-size:22px;font-weight:700}.hdr .sub{color:var(--gl);font-size:11px}
.wrap{max-width:1400px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:2px;margin-bottom:16px;background:var(--wh);border-radius:var(--r);padding:3px;box-shadow:var(--sh);flex-wrap:wrap}
.tab{padding:9px 14px;border:none;background:transparent;font-size:12px;font-weight:600;color:var(--gr);cursor:pointer;border-radius:7px;transition:.2s}.tab:hover{background:#f3f4f6}.tab.act{background:var(--gd);color:#fff}
.tc{display:none}.tc.act{display:block}
.card{background:var(--wh);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.ct{font-size:15px;font-weight:700;color:var(--gd);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.btn{padding:7px 16px;border:none;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:4px}
.btn:hover{transform:translateY(-1px)}.bg{background:var(--gd);color:#fff}.bo{background:var(--or);color:#fff}.bb{background:var(--bl);color:#fff}.br{background:var(--rd);color:#fff}
.btn-sm{padding:5px 10px;font-size:10px}.btn-del{background:#fee;color:var(--rd);border:1px solid #fcc}
table{width:100%;border-collapse:collapse;font-size:11px}th{background:var(--gd);color:#fff;padding:7px 8px;text-align:left;font-weight:600;font-size:10px}
th.or{background:var(--or)}th.bl{background:var(--bl)}th.gm{background:var(--gm)}
td{padding:7px 8px;border-bottom:1px solid #e5e7eb}tr:hover td{background:var(--gbg)}
input,select,textarea{padding:5px 8px;border:1.5px solid #d1d5db;border-radius:5px;font-size:11px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gd);box-shadow:0 0 0 3px rgba(45,106,79,.1)}
textarea{min-height:50px;resize:vertical}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg3{grid-template-columns:1fr 1fr 1fr}
.fg label{display:block;font-size:10px;font-weight:600;color:var(--gr);margin-bottom:2px}
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:9px;font-weight:600}
.b-bio{background:#e8f5e9;color:var(--gd)}.b-hve{background:var(--bbg);color:var(--bl)}.b-vdc{background:var(--obg);color:var(--or)}.b-conv{background:#f3f4f6;color:var(--gr)}
.al{padding:10px 14px;border-radius:var(--r);margin-bottom:10px;font-size:11px;border-left:4px solid}
.al-g{background:#e8f5e9;border-color:var(--gm)}.al-o{background:var(--obg);border-color:var(--or)}.al-r{background:var(--rbg);border-color:var(--rd)}.al-b{background:var(--bbg);border-color:var(--bl)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.g7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sc{background:var(--wh);border-radius:var(--r);padding:14px;box-shadow:var(--sh);text-align:center;border-left:4px solid var(--gd)}
.sv{font-size:26px;font-weight:700;color:var(--gd)}.sl{color:var(--gr);font-size:10px;margin-top:2px}
.sc.or{border-left-color:var(--or)}.sc.or .sv{color:var(--or)}.sc.bl{border-left-color:var(--bl)}.sc.bl .sv{color:var(--bl)}.sc.rd{border-left-color:var(--rd)}.sc.rd .sv{color:var(--rd)}
.md{background:var(--wh);border-radius:var(--r);padding:10px;text-align:center;box-shadow:var(--sh)}
.ri{margin-top:3px;padding:2px 5px;border-radius:4px;font-size:9px;font-weight:600;display:inline-block}
.ri-n{background:#e8f5e9;color:#2e7d32}.ri-m{background:var(--obg);color:#e65100}.ri-h{background:var(--rbg);color:var(--rd)}
.preview{background:var(--wh);border:2px solid var(--gl);border-radius:var(--r);padding:20px;max-height:70vh;overflow-y:auto}
.preview h2{color:var(--gd);font-size:14px;border-bottom:2px solid var(--gd);padding-bottom:3px;margin:14px 0 6px}
.preview .banner{background:var(--gd);color:#fff;padding:14px;border-radius:8px;text-align:center;margin-bottom:14px}
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:100}
.modal-bg.show{display:flex}.modal{background:#fff;border-radius:var(--r);padding:22px;max-width:700px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h3{color:var(--gd);margin-bottom:14px;font-size:16px}
</style>
</head>
<body>
<div class="hdr">
 <div><h1>🍇 VITI Sens</h1><div class="sub">Dashboard — Campagne 2026</div></div>
 <div style="display:flex;gap:8px;align-items:center">
  <button class="btn bb btn-sm" onclick="fetchMeteo()">🌤️ Météo</button>
  <button class="btn bo btn-sm" onclick="genTous()">📦 Tous les bulletins</button>
  <label class="btn btn-sm" style="background:#f3f4f6;color:var(--bk);cursor:pointer"><input type="file" accept=".xlsx" style="display:none" onchange="importXL(this)">📂 Importer Excel</label>
 </div>
</div>
<div class="wrap">
 <div class="tabs" id="tabsBar"></div>
 <div class="tc act" id="tc-home"></div>
 <div class="tc" id="tc-clients"></div>
 <div class="tc" id="tc-catalogue"></div>
 <div class="tc" id="tc-prescriptions"></div>
 <div class="tc" id="tc-bulletin"></div>
 <div class="tc" id="tc-meteo"></div>
 <div class="tc" id="tc-preview"></div>
 <div class="tc" id="tc-generate"></div>
 <div class="tc" id="tc-maturite"></div>
 <div class="tc" id="tc-portails"></div>
 <div class="tc" id="tc-outils"></div>
</div>
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal" id="MC"></div></div>

<script>
const T=['home','clients','catalogue','prescriptions','bulletin','meteo','preview','generate','portails','outils'];
const TL=['📊 Accueil','👥 Clients','💊 Catalogue','📋 Prescriptions','📝 Bulletin Hebdo','🌤️ Météo','👁️ Prévisualiser','📄 Générer','🌿 Portails','🔧 Outils'];
let CLIENTS=[],METEO=null;

// Tabs
const tb=document.getElementById('tabsBar');
T.forEach((t,i)=>{const b=document.createElement('button');b.className='tab'+(i===0?' act':'');b.textContent=TL[i];b.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('act'));b.classList.add('act');
 document.querySelectorAll('.tc').forEach(x=>x.classList.remove('act'));document.getElementById('tc-'+t).classList.add('act');
 if(t==='clients')loadClients();if(t==='catalogue')loadCat();if(t==='prescriptions')loadPresc();
 if(t==='bulletin'){loadBH();setTimeout(loadComplPdfs,500);}if(t==='preview')loadPrevSel();if(t==='generate'){loadGenSel();setTimeout(genTokens,300);}if(t==='maturite')loadMaturiteAdmin();
 if(t==='portails')loadPortails();
 if(t==='outils')loadOutils();
};tb.appendChild(b);});

// API
async function api(path,opts={}){return fetch(path,{headers:{'Content-Type':'application/json'},...opts});}
async function aj(path,opts={}){return(await api(path,opts)).json();}
function closeModal(){document.getElementById('modal').classList.remove('show');}

// Init
async function init(){
 CLIENTS=await aj('/api/clients');
 const cat=await aj('/api/catalogue');const presc=await aj('/api/prescriptions');
 document.getElementById('tc-home').innerHTML=`
  <div class="g4">
   <div class="sc"><div class="sv">${CLIENTS.length}</div><div class="sl">Clients</div></div>
   <div class="sc or"><div class="sv">${cat.length}</div><div class="sl">Produits</div></div>
   <div class="sc bl"><div class="sv">${presc.length}</div><div class="sl">Prescriptions</div></div>
   <div class="sc rd"><div class="sv">${CLIENTS.filter(c=>c.certification==='Bio').length}</div><div class="sl">Clients Bio</div></div>
  </div><div style="height:12px"></div>
  <div id="homeAlerts"></div>
  <div class="g2">
   <div class="card"><div class="ct">🌤️ Météo</div><div id="meteoQ"><button class="btn bb" onclick="fetchMeteo()">Charger</button></div></div>
   <div class="card"><div class="ct">🍄 Risques</div><div id="riskQ"><p style="color:var(--gr);font-size:10px">Chargez la météo</p></div></div>
  </div>`;
 let al='';CLIENTS.filter(c=>c.certification==='Bio'&&c.cu_cumule>3000).forEach(c=>{al+=`<div class="al al-r"><strong>⚠️ ${c.exploitation}</strong> — Cu ${c.cu_cumule} g/ha</div>`;});
 document.getElementById('homeAlerts').innerHTML=al;
}
init();

// ===== CLIENTS =====
async function loadClients(){
 CLIENTS=await aj('/api/clients');
 let h='<div class="card"><div class="ct"><span>👥 Clients</span><button class="btn bg btn-sm" onclick="showCF()">+ Ajouter</button></div>';
 h+='<table><tr><th>ID</th><th>Exploitation</th><th>Commune</th><th>Certif.</th><th>Surface</th><th>Tél.</th><th>Cu</th><th>Actions</th></tr>';
 CLIENTS.forEach(c=>{const bc=c.certification==='Bio'?'b-bio':c.certification==='HVE'?'b-hve':c.certification==='VDC'?'b-vdc':'b-conv';
  h+=`<tr><td>${c.id}</td><td><strong>${c.exploitation}</strong></td><td>${c.commune||''}</td><td><span class="badge ${bc}">${c.certification||'Conv.'}</span></td><td>${c.surface||''} ha</td><td style="font-size:9px">${c.telephone||'—'}</td><td>${c.certification==='Bio'?(c.cu_cumule||0)+' g/ha':'—'}</td><td><button class="btn btn-sm bg" onclick="editC('${c.id}')">✏️</button> <button class="btn btn-sm btn-del" onclick="delC('${c.id}')">🗑</button></td></tr>`;
 });h+='</table></div>';document.getElementById('tc-clients').innerHTML=h;
}
function showCF(d){d=d||{};document.getElementById('MC').innerHTML=`<h3>${d.id?'Modifier':'Ajouter'} client</h3>
<div class="fg"><div><label>ID</label><input id="cf_id" value="${d.id||''}" ${d.id?'readonly':''}></div><div><label>Exploitation</label><input id="cf_exp" value="${d.exploitation||''}"></div>
<div><label>Interlocuteur</label><input id="cf_int" value="${d.interlocuteur||''}"></div><div><label>Commune</label><input id="cf_com" value="${d.commune||''}"></div>
<div><label>Certification</label><select id="cf_cert">${['Conventionnel','HVE','VDC','Bio','Terra Vitis'].map(o=>`<option ${d.certification===o?'selected':''}>${o}</option>`).join('')}</select></div>
<div><label>Surface (ha)</label><input type="number" id="cf_sur" value="${d.surface||''}"></div>
<div><label>% Chard</label><input type="number" id="cf_ch" value="${d.pct_chard||0}"></div><div><label>% PN</label><input type="number" id="cf_pn" value="${d.pct_pn||0}"></div>
<div><label>% Meunier</label><input type="number" id="cf_me" value="${d.pct_meunier||0}"></div><div><label>Cu cumulé (g/ha)</label><input type="number" id="cf_cu" value="${d.cu_cumule||0}"></div>
<div><label>Parcelles mildiou</label><input id="cf_pm" value="${d.parcelles_mildiou||''}"></div><div><label>Parcelles oïdium</label><input id="cf_po" value="${d.parcelles_oidium||''}"></div>
<div><label>Email</label><input id="cf_em" value="${d.email||''}"></div><div><label>Téléphone</label><input id="cf_tel" value="${d.telephone||''}" placeholder="0612345678"></div>
<div><label>Latitude</label><input id="cf_lat" value="${d.latitude||''}" placeholder="49.1035" type="number" step="0.0001"></div><div><label>Longitude</label><input id="cf_lon" value="${d.longitude||''}" placeholder="3.9812" type="number" step="0.0001"></div>
<div style="grid-column:span 2"><label>Notes</label><textarea id="cf_no">${d.notes||''}</textarea></div></div>
<div style="margin-top:12px"><button class="btn bg" onclick="saveC('${d.id||''}')">${d.id?'Modifier':'Ajouter'}</button> <button class="btn btn-sm" style="background:#f3f4f6" onclick="closeModal()">Annuler</button></div>`;
document.getElementById('modal').classList.add('show');}
async function editC(id){showCF(CLIENTS.find(c=>c.id===id));}
async function saveC(eid){const d={id:document.getElementById('cf_id').value,exploitation:document.getElementById('cf_exp').value,interlocuteur:document.getElementById('cf_int').value,commune:document.getElementById('cf_com').value,certification:document.getElementById('cf_cert').value,surface:parseFloat(document.getElementById('cf_sur').value)||0,pct_chard:parseFloat(document.getElementById('cf_ch').value)||0,pct_pn:parseFloat(document.getElementById('cf_pn').value)||0,pct_meunier:parseFloat(document.getElementById('cf_me').value)||0,cu_cumule:parseFloat(document.getElementById('cf_cu').value)||0,parcelles_mildiou:document.getElementById('cf_pm').value,parcelles_oidium:document.getElementById('cf_po').value,email:document.getElementById('cf_em').value,telephone:document.getElementById('cf_tel').value,latitude:parseFloat(document.getElementById('cf_lat').value)||null,longitude:parseFloat(document.getElementById('cf_lon').value)||null,notes:document.getElementById('cf_no').value};
if(eid)await api(`/api/clients/${eid}`,{method:'PUT',body:JSON.stringify(d)});else await api('/api/clients',{method:'POST',body:JSON.stringify(d)});closeModal();loadClients();init();}
async function delC(id){if(confirm('Supprimer '+id+' ?')){await api(`/api/clients/${id}`,{method:'DELETE'});loadClients();init();}}

// ===== CATALOGUE =====
async function loadCat(){
 const cat=document.getElementById('fc_cat')?.value||'all';
 const cib=document.getElementById('fc_cib')?.value||'all';
 const cer=document.getElementById('fc_cer')?.value||'all';
 const prods=await aj(`/api/catalogue?categorie=${cat}&cible=${cib}&certification=${cer}`);
 let h=`<div class="card"><div class="ct"><span>💊 Catalogue Produits & MFSC</span><div><button class="btn bo btn-sm" onclick="showPF()">+ Phyto</button> <button class="btn btn-sm" style="background:var(--gm);color:#fff" onclick="showMF()">+ MFSC</button></div></div>
 <div style="margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap">
  <select id="fc_cat" onchange="loadCat()" style="width:auto"><option value="all">Toutes catégories</option><option value="Phyto">🧪 Phyto</option><option value="Fertilisant foliaire">🌿 Fertilisants</option><option value="Biostimulant">🧬 Biostimulants</option><option value="Amendement">🌱 Amendements</option><option value="Adjuvant">⚗️ Adjuvants</option></select>
  <select id="fc_cib" onchange="loadCat()" style="width:auto"><option value="all">Toutes cibles</option><option value="mildiou">Mildiou</option><option value="dium">Oïdium</option><option value="botrytis">Botrytis</option><option value="nutrition">Nutrition</option></select>
  <select id="fc_cer" onchange="loadCat()" style="width:auto"><option value="all">Toutes certif.</option><option value="Bio">Bio</option><option value="HVE">HVE</option></select>
 </div>
 <table><tr><th class="or">ID</th><th class="or">Cat.</th><th class="or">Produit</th><th class="or">Composition</th><th class="or">Cible</th><th class="or">Type</th><th class="or">Dose</th><th class="or">Bio</th><th class="or">Opt.</th><th class="or">Actions</th></tr>`;
 prods.forEach(p=>{const ic=p.categorie==='Phyto'?'🧪':p.categorie==='Fertilisant foliaire'?'🌿':p.categorie==='Biostimulant'?'🧬':'📦';
  const comp=p.substance_active||p.composition_npk||p.oligo_elements||'';
  h+=`<tr><td>${p.id}</td><td>${ic}</td><td><strong>${p.nom}</strong></td><td style="font-size:9px">${comp}</td><td>${p.cible||p.objectif||''}</td><td>${p.type_cps||p.type_mfsc||''}</td><td style="font-size:9px">${p.dose_homologuee||''}</td><td>${p.compatible_bio?'✅':'❌'}</td><td style="font-weight:700;${p.option_abc==='A'?'background:#e8f5e9':''}">${p.option_abc||''}</td><td><button class="btn btn-sm bg" onclick='editProd(${JSON.stringify(p).replace(/'/g,"&#39;")})'>✏️</button> <button class="btn btn-sm btn-del" onclick="delP('${p.id}')">🗑</button></td></tr>`;
 });h+=`</table><p style="margin-top:6px;font-size:10px;color:var(--gr)">${prods.length} produit(s)</p></div>`;
 document.getElementById('tc-catalogue').innerHTML=h;
}
// Préfixes par cible/catégorie
const ID_PREFIX = {
 'Mildiou':'M','Oïdium':'O','Botrytis':'B','Tordeuses':'T','Black rot':'BR','Flavescence dorée':'FD',
 'Fertilisant foliaire':'FF','Biostimulant':'BS','Amendement':'AM','Engrais':'EN','Adjuvant':'AJ'
};
function nextId(prefix){
 const existing = CATALOGUE.filter(p=>p.id && p.id.startsWith(prefix)).map(p=>{
  const num=parseInt(p.id.replace(prefix,''));return isNaN(num)?0:num;});
 const max = existing.length>0 ? Math.max(...existing) : 0;
 return prefix + String(max+1).padStart(3,'0');
}
function updatePhytoId(){
 const cible=document.getElementById('pf_cib')?.value||'Mildiou';
 const prefix=ID_PREFIX[cible]||'X';
 document.getElementById('pf_id').value=nextId(prefix);
}
function updateMfscId(){
 const cat=document.getElementById('mf_cat')?.value||'Fertilisant foliaire';
 const prefix=ID_PREFIX[cat]||'XX';
 document.getElementById('mf_id').value=nextId(prefix);
}

function showPF(){
 const defaultId=nextId('M');
 document.getElementById('MC').innerHTML=`<h3>Ajouter un produit phyto</h3>
<div class="fg fg3"><div><label>ID (auto)</label><input id="pf_id" value="${defaultId}" readonly style="background:#f3f4f6;font-weight:700"></div><div><label>Nom</label><input id="pf_nom"></div><div><label>SA</label><input id="pf_sa"></div>
<div><label>Cible</label><select id="pf_cib" onchange="updatePhytoId()"><option>Mildiou</option><option>Oïdium</option><option>Botrytis</option><option>Tordeuses</option><option>Black rot</option><option>Flavescence dorée</option></select></div>
<div><label>Type</label><select id="pf_ty"><option>Contact</option><option>Pénétrant</option><option>Systémique</option><option>Biocontrôle</option><option>SDN</option><option>Insecticide</option></select></div>
<div><label>Dose</label><input id="pf_do"></div><div><label>DAR</label><input type="number" id="pf_dar"></div><div><label>DRE</label><input type="number" id="pf_dre"></div>
<div><label>ZNT</label><input type="number" id="pf_znt"></div><div><label>Bio</label><select id="pf_bio"><option value="0">Non</option><option value="1">Oui</option></select></div>
<div><label>Option</label><select id="pf_opt"><option>A</option><option>B</option><option>C</option></select></div>
<div><label>Famille chimique</label><input id="pf_fam" placeholder="Anilide, CAA, QoI..."></div>
<div><label>Partenaire mélange</label><input id="pf_part" placeholder="Folpel, Cuivre..."></div>
<div><label>Conc. MA (g/kg ou g/L)</label><input type="number" id="pf_conc" placeholder="800"></div><div><label>Position</label><input id="pf_pos" placeholder="T1"></div>
<div><label>Notes</label><textarea id="pf_no"></textarea></div></div>
<button class="btn bo" style="margin-top:10px" onclick="savePF()">Ajouter</button> <button class="btn btn-sm" style="background:#f3f4f6" onclick="closeModal()">Annuler</button>`;
document.getElementById('modal').classList.add('show');}
async function savePF(){await api('/api/catalogue',{method:'POST',body:JSON.stringify({id:document.getElementById('pf_id').value,nom:document.getElementById('pf_nom').value,categorie:'Phyto',substance_active:document.getElementById('pf_sa').value,famille:document.getElementById('pf_fam').value,partenaire:document.getElementById('pf_part').value,cible:document.getElementById('pf_cib').value,type_cps:document.getElementById('pf_ty').value,dose_homologuee:document.getElementById('pf_do').value,dar:parseInt(document.getElementById('pf_dar').value)||0,dre:parseInt(document.getElementById('pf_dre').value)||0,znt:parseInt(document.getElementById('pf_znt').value)||0,compatible_bio:document.getElementById('pf_bio').value==='1',option_abc:document.getElementById('pf_opt').value,concentration_ma:parseFloat(document.getElementById('pf_conc').value)||0,position_strategie:document.getElementById('pf_pos').value,notes:document.getElementById('pf_no').value})});closeModal();loadCat();loadCatalogueCache();}

function showMF(){
 const defaultId=nextId('FF');
 document.getElementById('MC').innerHTML=`<h3>Ajouter un Fertilisant / MFSC</h3>
<div class="fg fg3"><div><label>ID (auto)</label><input id="mf_id" value="${defaultId}" readonly style="background:#f3f4f6;font-weight:700"></div><div><label>Nom</label><input id="mf_nom"></div>
<div><label>Catégorie</label><select id="mf_cat" onchange="updateMfscId()"><option>Fertilisant foliaire</option><option>Biostimulant</option><option>Amendement</option><option>Engrais</option><option>Adjuvant</option></select></div>
<div><label>Type MFSC</label><select id="mf_ty"><option>Engrais foliaire</option><option>Biostimulant végétal</option><option>Biostimulant microbien</option><option>Correcteur carence</option><option>Amendement organique</option><option>Adjuvant</option></select></div>
<div><label>Composition NPK</label><input id="mf_npk" placeholder="4-3-6"></div><div><label>Oligo-éléments</label><input id="mf_ol" placeholder="Fe, Mn, Zn, B"></div>
<div><label>SA / Principe actif</label><input id="mf_sa" placeholder="Extraits algues"></div>

function xfRefreshAll(){
 const checked=document.querySelectorAll('.xf_cl_chk:checked');
 const nb=checked.length;
 const info=document.getElementById('xfClInfo');
 if(info) info.textContent=nb===0?'⚠️ Aucun client sélectionné':nb===1?`1 client — ${checked[0].parentElement.textContent.trim()}`:`${nb} clients sélectionnés`;
 // Auto-détecter le prochain passage pour les clients sélectionnés
 const selectedIds=new Set([...checked].map(c=>c.value));
 if(window._allPresc && selectedIds.size > 0){
  const clientPresc=(window._allPresc||[]).filter(p=>selectedIds.has(p.id_client));
  // Passages actifs (non annulés)
  const activePassages=clientPresc.filter(p=>p.statut!=='annulé').map(p=>p.passage).filter(Boolean);
  const activeSet=new Set(activePassages);
  // Passages annulés récupérables (annulé sans actif correspondant)
  const annulesRecup=clientPresc.filter(p=>p.statut==='annulé'&&p.passage&&!activeSet.has(p.passage))
   .map(p=>p.passage).filter(p=>p.startsWith('T')&&!isNaN(p.slice(1)))
   .sort((a,b)=>parseInt(a.slice(1))-parseInt(b.slice(1)));
  const paInput=document.getElementById('xf_pa');
  if(paInput){
   if(annulesRecup.length){ paInput.value=annulesRecup[0]; }
   else{
    const clientTs=activePassages.filter(p=>p.startsWith('T')&&!isNaN(p.slice(1))).map(p=>parseInt(p.slice(1)));
    if(clientTs.length){ paInput.value='T'+(Math.max(...clientTs)+1); }
    else{ paInput.value='T1'; }
   }
  }
 }
 for(let i=1;i<=5;i++){if(document.getElementById('xf_ci'+i)) xfUpdateFamilles(i);}
}

function xfGetCert(){

 if(certs.includes('Bio')) return 'Bio';
 if(certs.includes('HVE')) return 'HVE';

}

// Filtre le catalogue selon cible + certification
function xfGetFiltered(n){
 const cert=xfGetCert();
 const cibleSel=document.getElementById('xf_ci'+n);
 if(!cibleSel) return [];
 const cible=cibleSel.value.toLowerCase();
 return CATALOGUE.filter(p=>{
  if(cert==='Bio' && !p.compatible_bio) return false;
  if(cert==='HVE' && !p.compatible_hve) return false;
  const pc=(p.cible||'').toLowerCase();
  const po=(p.objectif||'').toLowerCase();
  const pcat=(p.categorie||'').toLowerCase();
  if(cible==='mildiou') return pc.includes('mildiou');
  if(cible==='oïdium') return pc.includes('dium');
  if(cible==='botrytis') return pc.includes('botrytis');
  if(cible==='tordeuses') return pc.includes('tordeuse');
  if(cible==='flavescence dorée') return pc.includes('cicadelle')||pc.includes('flavescence');
  if(cible==='nutrition'||cible==='correction carence'||cible==='anti-stress'||cible==='floraison-nouaison')
   return po.includes(cible)||pc.includes(cible);
  if(cible==='fertilisant foliaire') return pcat.includes('fertilisant');
  if(cible==='biostimulant') return pcat.includes('biostimulant');
  return true;
 });
}

 famSel.innerHTML='<option value="">— Toutes —</option>';

 if(part) filtered=filtered.filter(p=>(p.partenaire||'')==part);
 const prSel=document.getElementById('xf_pr'+n);
 if(!prSel) return;
 prSel.innerHTML='<option value="">— Choisir —</option>';
 filtered.forEach(p=>{
  const icon=p.categorie==='Phyto'?'🧪':p.categorie==='Fertilisant foliaire'?'🌿':'📦';
  const opt=p.option_abc?` [${p.option_abc}]`:'';
  prSel.innerHTML+=`<option value="${p.id}" data-sa="${p.substance_active||''}" data-ty="${p.type_cps||p.type_mfsc||''}" data-do="${p.dose_homologuee||''}" data-nom="${p.nom}" data-fam="${p.famille||''}">${icon} ${p.nom}${opt}</option>`;
 });
 // Si un seul résultat, sélectionner automatiquement
 if(filtered.length===1){prSel.selectedIndex=1;xfFillRow(n);}
}

 document.getElementById('xf_dh'+n).value=opt?.dataset?.do||'';

async function saveXMulti(){
 const checkedClients=[...document.querySelectorAll('.xf_cl_chk:checked')].map(c=>c.value);
 if(checkedClients.length===0){alert('Sélectionnez au moins un client');return;}
 const passage=document.getElementById('xf_pa').value;
 const vol=document.getElementById('xf_vo').value;
 const obs=document.getElementById('xf_ob').value;
 const datePrevue=document.getElementById('xf_dp_date').value||null;
 // Collecter les produits
 let prods=[];
 for(let i=1;i<=5;i++){
  const prSel=document.getElementById('xf_pr'+i);
  if(!prSel) continue;
  const opt=prSel.options[prSel.selectedIndex];
  if(!opt || prSel.selectedIndex===0) continue;
  const dp=document.getElementById('xf_dp'+i)?.value;
  if(!dp){alert('Renseignez la dose prescrite pour le produit '+i);return;}
  prods.push({
   cible:document.getElementById('xf_ci'+i)?.value||'',
   id_produit:prSel.value||'',
   nom_produit:opt?.dataset?.nom||opt?.textContent?.replace(/^[🧪🌿🧬📦]\s*/,'').replace(/\s*\[.\]$/,'')||'',
   substance_active:document.getElementById('xf_sa'+i)?.value||'',
   type_cps:document.getElementById('xf_ty'+i)?.value||'',
   dose_homologuee:document.getElementById('xf_dh'+i)?.value||'',
   dose_prescrite:dp
  });
 }
 if(prods.length===0){alert('Sélectionnez au moins un produit et renseignez sa dose');return;}
 // Confirmation avant enregistrement
 let recap=`${prods.length} produit(s) × ${checkedClients.length} client(s) = ${prods.length*checkedClients.length} prescription(s)\n\nPassage : ${passage}\n`;
 prods.forEach(p=>{recap+=`• ${p.nom_produit} → ${p.dose_prescrite}\n`;});
 recap+=`\nEnregistrer ?`;
 if(!confirm(recap))return;
 // Sauvegarder pour chaque client × chaque produit
 let total=0;
 for(const cid of checkedClients){
  for(const p of prods){
   await api('/api/prescriptions',{method:'POST',body:JSON.stringify({
    id_client:cid, cible:p.cible, passage:passage,
    id_produit:p.id_produit, nom_produit:p.nom_produit,
    substance_active:p.substance_active, type_cps:p.type_cps,
    dose_homologuee:p.dose_homologuee, dose_prescrite:p.dose_prescrite,
    volume_bouillie:vol, observations:obs, date_prevue:datePrevue
   })});
   total++;
  }
 }
 closeModal();loadPresc();
 // Générer et stocker les bulletins PDF pour chaque client concerné
 const clientIds=[...new Set(checkedClients)];
 genererEtStockerBulletins(clientIds);
 alert(`✅ ${prods.length} produit(s) × ${checkedClients.length} client(s) = ${total} prescription(s) enregistrée(s)\n📁 Bulletins PDF en cours de génération...`);
}

async function refreshMaturiteAdmin(){
 const cid=document.getElementById('ma_cl')?.value||'';
 const url='/api/maturite'+(cid?'?client_id='+cid:'');
 const [fiches,parcelles]=await Promise.all([aj(url),aj('/api/parcelles'+(cid?'?client_id='+cid:''))]);
 const el=document.getElementById('matuAdminContent');
 if(!fiches||!fiches.length){
  el.innerHTML=`<p style="color:var(--gr)">Aucune fiche de maturité.${!cid?' Sélectionnez un client ou saisissez une première fiche.':''}</p>`;
  if(parcelles&&parcelles.length){
   let ph='<div style="margin-top:10px"><strong>Parcelles :</strong><br>';
   parcelles.forEach(p=>ph+=`<span class="badge b-info" style="margin:2px">${p.nom} (${p.cepage||'?'})</span>`);
   el.innerHTML+=ph+'</div>';
  }
  return;
 }
 // Tableau récap trié par score décroissant
 let h='<table><tr><th>Client</th><th>Parcelle</th><th>Cépage</th><th>Date</th><th>Degré</th><th>AT</th><th>Score</th><th>Rendement</th><th>Recommandation</th></tr>';
 const sorted=[...fiches].sort((a,b)=>(b.score_total||0)-(a.score_total||0));
 sorted.forEach(f=>{
  const rcolor=f.score_total>=80?'var(--gm)':f.score_total>=60?'var(--or)':f.score_total>=40?'#FFC107':'var(--rd)';
  h+=`<tr>
   <td style="font-size:10px">${f.exploitation||cid}</td>
   <td><strong>${f.parcelle_nom||'?'}</strong></td>
   <td style="font-size:10px">${f.cepage||'?'}</td>
   <td style="font-size:10px">${f.date_fiche||''}</td>
   <td><strong>${f.degre_probable||'—'}%</strong></td>
   <td style="font-size:10px">${f.AT?f.AT+' g/L':'—'}</td>
   <td><span style="background:${rcolor};color:#fff;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700">${f.score_total||0}/100</span></td>
   <td style="font-size:10px">${f.rendement_kgha?f.rendement_kgha+' kg/ha':'—'}</td>
   <td style="font-size:9px">${f.recommandation||'—'}</td>
  </tr>`;
 });
 h+='</table>';
 el.innerHTML=h;
}

async function fetchMeteo(clientId){
 try{
 // Déterminer les coordonnées
 let url='/api/meteo';
 let locLabel='Reims (défaut)';
 if(clientId){
  const c=CLIENTS.find(x=>x.id===clientId);
  if(c){
   if(c.latitude&&c.longitude){url=`/api/meteo?lat=${c.latitude}&lon=${c.longitude}`;locLabel=`${c.exploitation} — ${c.commune||''} (${c.latitude}, ${c.longitude})`;}
   else if(c.commune){url=`/api/meteo?commune=${encodeURIComponent(c.commune)}`;locLabel=`${c.exploitation} — ${c.commune} (géocodage auto)`;}
   else{locLabel=`${c.exploitation} (pas de coordonnées → défaut Reims)`;}
  }
 }
 const days=await aj(url);if(days.error){alert('Erreur: '+days.error);return;}METEO=days;
const jf=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];let h='';
days.forEach(dd=>{const dt=new Date(dd.date);const rc=dd.risk==='Nul'||dd.risk==='Faible'?'ri-n':dd.risk==='Modéré'?'ri-m':'ri-h';
h+=`<div class="md"><div style="font-weight:700;font-size:10px">${jf[dt.getDay()]}</div><div style="font-size:9px;color:var(--gr)">${dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})}</div>
<div style="font-size:20px;font-weight:700">${Math.round(dd.tmax)}°</div><div style="font-size:10px;color:var(--bl)">${Math.round(dd.tmin)}°</div>
<div style="font-size:9px">${dd.pluie>0?'💧'+dd.pluie.toFixed(1)+'mm':'☀️ Sec'}</div>
<div style="font-size:8px;color:var(--gr)">${dd.soil_moisture_txt||''} · 🍃${dd.leaf_wetness!=null?dd.leaf_wetness+'%':'—'}</div>
<div style="font-size:8px;${dd.fenetre_traitement==='Oui'?'color:var(--gd);font-weight:700':'color:var(--gr)'}">${dd.fenetre_traitement==='Oui'?'✅Trt':'❌Trt'}</div>
<div class="ri ${rc}">🍄${dd.risk}</div></div>`;});
let selMet='<option value="">📍 Tous (Reims défaut)</option>';CLIENTS.forEach(c=>{const hasGps=c.latitude&&c.longitude;const sel2=clientId===c.id?'selected':'';
 selMet+=`<option value="${c.id}" ${sel2}>${c.exploitation} — ${c.commune||'?'} ${hasGps?'📍':''}</option>`;});
document.getElementById('tc-meteo').innerHTML=`<div class="card"><div class="ct"><span>🌤️ Météo 7 jours</span><div style="display:flex;gap:6px;align-items:center"><select id="meteo_cl" onchange="fetchMeteo(this.value)" style="width:auto;font-size:11px">${selMet}</select><button class="btn bb btn-sm" onclick="fetchMeteo(document.getElementById('meteo_cl')?.value)">🔄</button></div></div>
<p style="font-size:9px;color:var(--gr);margin-bottom:8px">📍 ${locLabel}</p>
<div class="g7">${h}</div><div style="margin-top:14px"><table><tr><th class="bl">Date</th><th class="bl">T°min</th><th class="bl">T°max</th><th class="bl">Pluie</th><th class="bl">HR</th><th class="bl">🍃Humect.</th><th class="bl">Sol</th><th class="bl">Vent</th><th class="bl">Trt?</th><th class="bl">🍄Mildiou</th><th class="bl">🫧Oïdium</th></tr>
${days.map(dd=>`<tr><td>${dd.date}</td><td>${dd.tmin}°</td><td>${dd.tmax}°</td><td>${dd.pluie}mm</td><td>${dd.hr!=null?Math.round(dd.hr)+'%':'—'}</td>
<td><span class="ri ${dd.leaf_wetness>=70?'ri-h':dd.leaf_wetness>=40?'ri-m':'ri-n'}">${dd.leaf_wetness!=null?dd.leaf_wetness+'%':'—'}</span></td>
<td>${dd.soil_moisture_txt||'—'}</td><td>${dd.wind!=null?Math.round(dd.wind)+'km/h':'—'}</td>
<td>${dd.fenetre_traitement==='Oui'?'<span style="color:var(--gd);font-weight:700">✅</span>':'<span style="color:var(--rd)">❌</span>'}</td>
<td><span class="ri ${dd.risk==='Nul'||dd.risk==='Faible'?'ri-n':dd.risk==='Modéré'?'ri-m':'ri-h'}">${dd.risk}</span></td>
<td><span class="ri ${dd.risk_oidium==='Nul'||dd.risk_oidium==='Faible'?'ri-n':dd.risk_oidium==='Modéré'?'ri-m':'ri-h'}">${dd.risk_oidium||'—'}</span></td></tr>`).join('')}
</table></div></div>`;
// Quick panels
document.getElementById('meteoQ').innerHTML=h.split('</div></div>').slice(0,3).join('</div></div>')+'</div></div>';
const risky=days.filter(dd=>dd.risk!=='Nul'&&dd.risk!=='Faible');const fen=days.filter(dd=>dd.fenetre_traitement==='Oui');
let rq='';if(risky.length)rq+=`<div class="al al-o">🍄 <strong>${risky.length}j risque mildiou</strong></div>`;else rq+=`<div class="al al-g">🍄 Pas de risque</div>`;
if(fen.length)rq+=`<div class="al al-b">🎯 <strong>${fen.length} fenêtre(s) trt</strong></div>`;else rq+=`<div class="al al-r">⚠️ Pas de fenêtre trt</div>`;
document.getElementById('riskQ').innerHTML=rq;
}catch(e){document.getElementById('meteoQ').innerHTML=`<div class="al al-r">❌ ${e.message}</div>`;}}

if(av.titre_complement&&av.contenu_complement)h+=`<h2>6. ${av.titre_complement}</h2><p>${av.contenu_complement}</p>`;

async function sendPortailSms(cid, tel, prenom, url, exploitation){
 const msg=`Bonjour ${prenom}, votre espace VITI Sens évolue ! Bulletins, météo et suivi des traitements : ${url}`;
 const charCount=msg.length;
 if(!confirm(`Envoyer le lien portail à ${exploitation} (${tel}) ?\n\n${msg}\n\n${charCount} caractères (${charCount<=160?'✅ 1 SMS':'⚠️ '+Math.ceil(charCount/153)+' SMS'})`))return;
 const btn=document.getElementById('sms_port_'+cid);
 if(btn){btn.disabled=true;btn.textContent='⏳';}
 try{
  const r=await api('/api/sms-send',{method:'POST',body:JSON.stringify({
   message:msg,
   clients:[cid]
  })});
  const d=await r.json();
  const res=d.results?.[0];
  if(btn){
   if(res?.status==='ok'){
    btn.textContent='✅ Envoyé';
    btn.style.background='#4CAF50';
    btn.disabled=true;
   }else{
    btn.textContent='❌ Erreur';
    btn.style.background='var(--rd)';
    btn.disabled=false;
   }
  }
 }catch(e){if(btn){btn.textContent='❌';btn.disabled=false;}}
}

  const nbProches=data.filter(c=>c.maturite&&(c.maturite.score_moyen||0)>=70).length;
  const nbSans=data.filter(c=>!c.maturite).length;

  let h='<div style="padding:0 16px 16px">';
  h+=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px">
   <div class="sc rd"><div class="sv">${nbAlertes}</div><div class="sl">Alertes urgentes</div></div>
   <div class="sc or"><div class="sv">${nbProches}</div><div class="sl">Proches fenêtre</div></div>
   <div class="sc"><div class="sv">${data.length}</div><div class="sl">Exploitations</div></div>
   <div class="sc"><div class="sv">${nbSans}</div><div class="sl">Sans relevé</div></div>
  </div>`;

  h+='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">';
  h+='<thead><tr style="background:#2D6A4F;color:#fff">';
  ['Exploitation','Cert.','Parc.','Dernier relevé','Degré moy.','Score moy.','Alertes sanitaires','Portail'].forEach(col=>{
   h+=`<th style="padding:8px 10px;text-align:left;font-weight:600;white-space:nowrap">${col}</th>`;
  });
  h+='</tr></thead><tbody>';

  data.forEach((c,i)=>{
   const m=c.maturite;
   const sc=m?m.score_moyen:null;
   const scCol=sc===null?'#999':sc>=70?'#2E7D32':sc>=40?'#E65100':'#C62828';
   const scBg=sc===null?'#f5f5f5':sc>=70?'#E8F5E9':sc>=40?'#FFF3E0':'#FFEBEE';
   const alertes=m&&m.alertes?m.alertes.filter(a=>a&&a!=='None'):[];
   const bg=i%2===0?'#fff':'#f9f8f6';
   h+=`<tr style="background:${bg};border-bottom:.5px solid #e8e6e1;vertical-align:top">`;
   h+=`<td style="padding:8px 10px"><strong>${c.exploitation}</strong></td>`;
   h+=`<td style="padding:8px 10px">${certBadge(c.certification)}</td>`;
   h+=`<td style="padding:8px 10px;text-align:center;color:#666">${c.nb_parcelles||0}</td>`;
   h+=`<td style="padding:8px 10px;font-size:11px;color:#666;white-space:nowrap">${m?fmtD(m.date):'<span style="color:#ccc">—</span>'}</td>`;
   h+=`<td style="padding:8px 10px;font-weight:700;text-align:center">${m&&m.degre_moyen!=null?m.degre_moyen+'%':'—'}</td>`;
   h+=`<td style="padding:8px 10px;text-align:center"><span style="background:${scBg};color:${scCol};padding:3px 8px;border-radius:10px;font-weight:700">${sc!==null?sc+'/100':'—'}</span></td>`;
   let aCell=alertes.length?alertes.map(a=>`<div style="font-size:10px;color:${a.includes('urgent')?'#C62828':'#E65100'};margin-bottom:2px">${a.includes('urgent')?'⚠️ ':''} ${a}</div>`).join(''):'<span style="color:#ccc">—</span>';
   h+=`<td style="padding:8px 10px">${aCell}</td>`;
   h+=`<td style="padding:8px 10px">${portailBtn(c.portail_url)}</td>`;
   h+='</tr>';
  });
  h+='</tbody></table></div></div>';
  el.innerHTML=h;
  el.dataset.loaded='1';
 }catch(e){el.innerHTML=`<div style="padding:16px"><div class="al al-r">Erreur : ${e.message}</div></div>`;}
}

async function loadPortailPhyto(){
 const el=document.getElementById('portail-phyto');
 if(el.dataset.loaded) return;
 el.innerHTML='<div style="padding:20px;color:#666">Chargement...</div>';
 try{
  const data=await aj('/api/admin/portails-phyto');
  const nbAvec=data.filter(c=>c.phyto).length;
  const nbSans=data.filter(c=>!c.phyto).length;

  let h='<div style="padding:0 16px 16px">';
  h+=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px">
   <div class="sc"><div class="sv">${data.length}</div><div class="sl">Exploitations</div></div>
   <div class="sc bl"><div class="sv">${nbAvec}</div><div class="sl">Avec prescriptions</div></div>
   <div class="sc"><div class="sv">${nbSans}</div><div class="sl">Sans prescription</div></div>
  </div>`;

  h+='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">';
  h+='<thead><tr style="background:#2D6A4F;color:#fff">';
  ['Exploitation','Cert.','Dernier passage','Statut','Produits conseillés','Portail'].forEach(col=>{
   h+=`<th style="padding:8px 10px;text-align:left;font-weight:600;white-space:nowrap">${col}</th>`;
  });
  h+='</tr></thead><tbody>';

  data.forEach((c,i)=>{
   const ph=c.phyto;
   const bg=i%2===0?'#fff':'#f9f8f6';
   h+=`<tr style="background:${bg};border-bottom:.5px solid #e8e6e1;vertical-align:top">`;
   h+=`<td style="padding:8px 10px"><strong>${c.exploitation}</strong></td>`;
   h+=`<td style="padding:8px 10px">${certBadge(c.certification)}</td>`;
   // Passage + date
   if(ph){
    h+=`<td style="padding:8px 10px"><span style="font-weight:700;color:#2D6A4F">${ph.passage}</span><div style="font-size:10px;color:#666">${fmtD(ph.date)}</div></td>`;
    // Statut global
    const app=ph.applique==='Oui';
    h+=`<td style="padding:8px 10px"><span style="font-size:11px;padding:3px 8px;border-radius:10px;background:${app?'#E8F5E9':'#FFF3E0'};color:${app?'#2E7D32':'#E65100'};font-weight:600">${app?'✓ Appliqué':'⏳ Prévu'}</span></td>`;
    // Produits
    let pCell=ph.produits.map(p=>{
     let s=`<div style="margin-bottom:5px;padding:5px 8px;background:#f5f5f5;border-radius:4px;border-left:3px solid #2D6A4F">`;
     s+=`<div style="font-weight:600">${p.nom}</div>`;
     if(p.sa) s+=`<div style="font-size:10px;color:#666">${p.sa}</div>`;
     if(p.dose) s+=`<div style="font-size:10px;color:#1565C0">${p.dose}</div>`;
     if(p.cible) s+=`<div style="font-size:10px;color:#9C27B0">Cible : ${p.cible}</div>`;
     s+='</div>';
     return s;
    }).join('');
    h+=`<td style="padding:8px 10px;min-width:220px">${pCell}</td>`;
   } else {
    h+='<td style="padding:8px 10px;color:#ccc">—</td>';
    h+='<td style="padding:8px 10px;color:#ccc">—</td>';
    h+='<td style="padding:8px 10px;color:#ccc">—</td>';
   }
   h+=`<td style="padding:8px 10px">${portailBtn(c.portail_url)}</td>`;
   h+='</tr>';
  });
  h+='</tbody></table></div></div>';
  el.innerHTML=h;
  el.dataset.loaded='1';
 }catch(e){el.innerHTML=`<div style="padding:16px"><div class="al al-r">Erreur : ${e.message}</div></div>`;}
}

// ===== OUTILS ADMIN =====
function loadOutils(){
 const el=document.getElementById('tc-outils');
 el.innerHTML=`<div style="padding:20px;max-width:600px">
  <div style="font-size:16px;font-weight:600;margin-bottom:16px">🔧 Outils administrateur</div>

  <div style="border:.5px solid #e5e7eb;border-radius:10px;padding:16px;margin-bottom:12px">
   <div style="font-size:13px;font-weight:600;margin-bottom:4px">Effacer les rendements réels</div>
   <div style="font-size:12px;color:#666;margin-bottom:10px">
    Remet à zéro les rendements réels, kg cumulés et statuts de récolte pour tous les clients ou un client spécifique.<br>
    <strong>Visible uniquement dans ce dashboard — pas sur les portails clients.</strong>
   </div>
   <div style="display:flex;gap:8px;margin-bottom:8px">
    <select id="outils-client-sel" style="flex:1;padding:7px;border:.5px solid #e5e7eb;border-radius:6px;font-size:12px">
     <option value="">— Tous les clients —</option>
    </select>
    <button onclick="outilsResetRdtReels()" style="background:#C62828;color:#fff;border:none;padding:7px 16px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer">Effacer</button>
   </div>
   <div id="outils-rdtreel-msg" style="font-size:11px;min-height:16px"></div>
  </div>

  <div style="border:.5px solid #e5e7eb;border-radius:10px;padding:16px;margin-bottom:12px">
   <div style="font-size:13px;font-weight:600;margin-bottom:4px">Normalisation communes</div>
   <div style="font-size:12px;color:#666;margin-bottom:10px">Passe toutes les communes en majuscules dans la base de données.</div>
   <button onclick="outilsFixCommunes()" style="background:#2D6A4F;color:#fff;border:none;padding:7px 16px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer">Convertir</button>
   <span id="outils-communes-msg" style="font-size:11px;color:#666;margin-left:8px"></span>
  </div>

 </div>`;

 // Charger la liste clients
 aj('/api/clients').then(clients=>{
  const sel=document.getElementById('outils-client-sel');
  if(!sel) return;
  clients.sort((a,b)=>a.exploitation.localeCompare(b.exploitation,'fr'));
  clients.forEach(c=>{
   const o=document.createElement('option');
   o.value=c.id; o.textContent=c.exploitation;
   sel.appendChild(o);
  });
 }).catch(()=>{});
}

async function outilsResetRdtReels(){
 const cid=document.getElementById('outils-client-sel').value;
 const who=cid?document.getElementById('outils-client-sel').options[document.getElementById('outils-client-sel').selectedIndex].text:'TOUS LES CLIENTS';
 if(!confirm(`Effacer les rendements réels pour : ${who} ?\nCette action est irréversible.`)) return;
 try{
  const r=await aj('/api/admin/reset-rendements-reels',{method:'POST',body:JSON.stringify({id_client:cid||null})});
  const msg=document.getElementById('outils-rdtreel-msg');
  if(r.ok) msg.innerHTML=`<span style="color:#2E7D32">✅ ${r.updated} enregistrement(s) remis à zéro.</span>`;
  else msg.innerHTML=`<span style="color:#C62828">Erreur</span>`;
 }catch(e){ document.getElementById('outils-rdtreel-msg').textContent='Erreur : '+e.message; }
}

async function outilsFixCommunes(){
 try{
  const r=await aj('/api/admin/fix-communes');
  document.getElementById('outils-communes-msg').textContent=r.message||'OK';
 }catch(e){ document.getElementById('outils-communes-msg').textContent='Erreur'; }
}
</script>
</body>
